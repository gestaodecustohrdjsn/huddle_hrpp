<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Huddle HRPP</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="container">
    <header class="header">
      <div class="header-conteudo">
        <div class="header-titulo">
          <h1>HUDDLE HRPP</h1>
          <p>Gestão local de reuniões, setores, perguntas e pendências</p>
        </div>

        <div class="header-direita">
          <button
            class="btn-icone-config"
            title="Configurações"
            aria-label="Configurações"
            onclick="Huddle.Reunioes.renderConfiguracoesEmBreve()"
          >
            ⚙
          </button>

          <div class="header-logos">
            <!-- Para deixar o cabeçalho mais clean, apague uma ou ambas as linhas de imagem abaixo. -->
            <img src="images/Logo_Hospital.svg" alt="Logo Hospital">
            <img src="images/Logo_Empresa.svg" alt="Logo Empresa">
          </div>
        </div>
      </div>
    </header>

    <section id="app"></section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="data/seed.js"></script>
  <script src="js/perguntas.js"></script>
  <script src="js/pendencias.js"></script>
  <script src="js/reunioes.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
